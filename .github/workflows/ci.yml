name: CI

# Runs on every push to main, on pull requests, on manual dispatch, and when the "Regenerate
# demo assets" workflow dispatches it after committing regenerated files (commits pushed with
# GITHUB_TOKEN do not trigger `push` workflows, so that workflow triggers CI explicitly).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Demo documents are reproducible
        # Regenerate from source, then let Git tell us whether the tracked files changed.
        # No hand-maintained checksum list: the generator itself is the source of truth.
        run: python scripts/check_examples.py
      - name: Tests (no Gemini API key needed)
        env:
          GEMINI_API_KEY: ""
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t what-am-i-agreeing-to:ci .
      - name: Smoke test container
        run: |
          docker run -d --name waiat -p 8000:8000 what-am-i-agreeing-to:ci
          trap 'docker rm -f waiat >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then ok=1; break; fi
            sleep 1
          done
          [ "${ok:-0}" = "1" ] || (docker logs waiat; exit 1)
          echo
          bash scripts/smoke.sh http://127.0.0.1:8000
