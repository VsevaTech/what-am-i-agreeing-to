name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Demo documents are reproducible
        run: |
          md5sum examples/*.pdf > /tmp/before.md5
          python examples/build_examples.py
          md5sum -c /tmp/before.md5
      - name: Tests (no Gemini API key needed)
        env:
          GEMINI_API_KEY: ""
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t what-am-i-agreeing-to:ci .
      - name: Smoke test container
        run: |
          docker run -d --name waiat -p 8000:8000 what-am-i-agreeing-to:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then ok=1; break; fi
            sleep 1
          done
          [ "${ok:-0}" = "1" ] || (docker logs waiat; exit 1)
          curl -fsS -o /dev/null -F "file=@examples/simple-subscription.pdf" http://127.0.0.1:8000/analyze
          docker rm -f waiat
