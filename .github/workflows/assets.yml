name: Regenerate demo assets

# Rebuilds the synthetic demo PDFs, the vendored htmx bundle and the README screenshots from
# source, and commits them if anything changed. No API key is involved: the screenshots use the
# deterministic stub provider in scripts/capture_screenshots.py.
#
# Commits pushed with GITHUB_TOKEN do not trigger `push` workflows. So that the bot commit on
# main still gets a real CI result, this workflow dispatches CI explicitly after pushing.
# No loop: CI never commits, and neither the bot push nor the dispatch re-triggers this workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - examples/build_examples.py
      - scripts/capture_screenshots.py
      - .github/workflows/assets.yml

permissions:
  contents: write # commit regenerated assets
  actions: write # dispatch CI for the bot commit

concurrency:
  group: demo-assets
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]" playwright
          python -m playwright install --with-deps chromium
      - name: Vendor htmx (if missing)
        run: |
          if [ ! -s app/static/htmx.min.js ]; then
            npm pack htmx.org@2.0.4 --silent
            tar xzf htmx.org-2.0.4.tgz package/dist/htmx.min.js
            mv package/dist/htmx.min.js app/static/htmx.min.js
            rm -rf package htmx.org-2.0.4.tgz
          fi
      - name: Build demo PDFs
        run: python examples/build_examples.py
      - name: Capture screenshots
        run: python scripts/capture_screenshots.py docs/screenshots
      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/*.pdf app/static/htmx.min.js docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Assets unchanged."
          else
            git commit -m "Regenerate demo assets"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run CI on the bot commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
